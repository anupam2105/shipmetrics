services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipmetrics
      POSTGRES_PASSWORD: shipmetrics
      POSTGRES_DB: shipmetrics
    ports:
      - "5432:5432"
    volumes:
      - shipmetrics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipmetrics -d shipmetrics"]
      interval: 5s
      timeout: 3s
      retries: 10

  shipmetrics:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SHIPMETRICS_DATABASE_URL: postgres://shipmetrics:shipmetrics@postgres:5432/shipmetrics?sslmode=disable
      SHIPMETRICS_LOG_FORMAT: text
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["demo"]

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - shipmetrics
    profiles: ["demo"]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["demo"]

volumes:
  shipmetrics_pg_data:
