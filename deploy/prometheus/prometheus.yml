global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: shipmetrics-demo

scrape_configs:
  - job_name: shipmetrics
    metrics_path: /metrics
    # Preserve app-emitted `service` and `environment` labels — they identify
    # the deployment target, not the scrape target.
    honor_labels: true
    static_configs:
      - targets: ["shipmetrics:8080"]
