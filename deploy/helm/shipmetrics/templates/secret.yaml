{{- /*
Only rendered when the user provided an inline database.url. When an existing
secret is referenced, we consume it directly from the Deployment.
*/ -}}
{{- if and .Values.database.url (not .Values.database.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shipmetrics.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shipmetrics.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.url | quote }}
{{- end }}
