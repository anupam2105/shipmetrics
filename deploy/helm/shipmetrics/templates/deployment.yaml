{{- include "shipmetrics.assertDatabase" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shipmetrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shipmetrics.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shipmetrics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shipmetrics.labels" . | nindent 8 }}
      annotations:
        # Roll pods when database source changes.
        checksum/db: {{ printf "%s-%s-%s" .Values.database.url .Values.database.existingSecret .Values.database.existingSecretKey | sha256sum }}
    spec:
      serviceAccountName: {{ include "shipmetrics.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: shipmetrics
          image: {{ include "shipmetrics.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: 8080
              protocol: TCP
          env:
            - name: SHIPMETRICS_HTTP_ADDR
              value: ":8080"
            - name: SHIPMETRICS_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SHIPMETRICS_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: SHIPMETRICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.database.existingSecret }}
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
                  {{- else }}
                  name: {{ include "shipmetrics.fullname" . }}-db
                  key: database-url
                  {{- end }}
            {{- if .Values.api.existingSecret }}
            - name: SHIPMETRICS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret }}
                  key: {{ .Values.api.existingSecretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.portName }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.portName }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
